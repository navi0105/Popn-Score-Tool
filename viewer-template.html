<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pop'n Score Tool</title>
<style>
:root {
  --bg: #faf3ee;
  --surface: #ffffff;
  --surface2: #fff4ec;
  --surface3: #ffe7d8;
  --border: #eed9c9;
  --text: #3a2a20;
  --text2: #97826f;
  --accent: #e94560;
  --accent-soft: #fde4e9;
  --accent2: #2ecc71;
  --blue: #4a8fe7;
  --yellow: #e0900a;
  --dekkapop: #a06ec0;
  --easy: #1ea868;
  --normal: #2e7ed6;
  --hyper: #d08a10;
  --ex: #d04030;
  --shadow: 0 2px 10px rgba(180, 120, 90, 0.14);
  --appbar-bg: rgba(255, 255, 255, 0.92);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1512;
    --surface: #26201b;
    --surface2: #2e2720;
    --surface3: #3a3126;
    --border: #46392e;
    --text: #f0e6dc;
    --text2: #a8927e;
    --accent: #ff5f7a;
    --accent-soft: #47232d;
    --accent2: #2fb56b;
    --blue: #6aa4f0;
    --yellow: #e8a83a;
    --dekkapop: #bd8ce0;
    --easy: #35c084;
    --normal: #5da4f2;
    --hyper: #eda93e;
    --ex: #f0685a;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
    --appbar-bg: rgba(38, 32, 27, 0.92);
  }
}
:root[data-theme="dark"] {
  --bg: #1b1512;
  --surface: #26201b;
  --surface2: #2e2720;
  --surface3: #3a3126;
  --border: #46392e;
  --text: #f0e6dc;
  --text2: #a8927e;
  --accent: #ff5f7a;
  --accent-soft: #47232d;
  --accent2: #2fb56b;
  --blue: #6aa4f0;
  --yellow: #e8a83a;
  --dekkapop: #bd8ce0;
  --easy: #35c084;
  --normal: #5da4f2;
  --hyper: #eda93e;
  --ex: #f0685a;
  --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
  --appbar-bg: rgba(38, 32, 27, 0.92);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}
.container { max-width: 1200px; margin: 0 auto; padding: 16px 20px 24px; }
h2 { color: var(--text); font-size: 17px; margin: 0 0 12px 0; letter-spacing: 0.3px; }
h2 .h2-sub { font-size: 12px; color: var(--text2); font-weight: normal; margin-left: 8px; }

/* ===== App bar (sticky) ===== */
.appbar {
  position: sticky; top: 0; z-index: 60;
  background: var(--appbar-bg);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.appbar-inner {
  max-width: 1200px; margin: 0 auto; padding: 8px 20px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.brand .logo {
  width: 30px; height: 30px; border-radius: 9px;
  background: linear-gradient(135deg, var(--accent), #f08a4b);
  color: #fff; font-weight: bold; font-size: 15px;
  display: flex; align-items: center; justify-content: center;
}
.brand .brand-name { font-size: 16px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.brand .brand-ver {
  font-size: 10px; color: var(--text2); border: 1px solid var(--border);
  border-radius: 99px; padding: 1px 8px; white-space: nowrap;
}
.appbar .player-strip { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.appbar .avatar {
  width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border);
  object-fit: cover; flex-shrink: 0;
}
.appbar .player-name { font-weight: 700; font-size: 14px; white-space: nowrap; }
.appbar .stat-chip {
  font-size: 11px; color: var(--text2); background: var(--surface2);
  border: 1px solid var(--border); border-radius: 99px; padding: 2px 9px; white-space: nowrap;
}
.appbar .stat-chip b { color: var(--accent); font-family: 'Consolas', monospace; }
.appbar-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.icon-btn {
  width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); cursor: pointer; font-size: 15px;
  display: flex; align-items: center; justify-content: center;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.btn {
  padding: 6px 14px; border: none; border-radius: 8px;
  background: var(--accent); color: #fff; cursor: pointer;
  font-size: 13px; font-family: inherit; white-space: nowrap;
}
.btn:hover { opacity: 0.85; }
.btn.btn-green { background: var(--accent2); }
.btn.btn-ghost { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.btn.btn-ghost:hover { border-color: var(--accent); color: var(--accent); opacity: 1; }

/* ===== Tabs (segmented) ===== */
.tabs-wrap { overflow-x: auto; margin: 14px 0 18px; -webkit-overflow-scrolling: touch; }
.tabs {
  display: inline-flex; gap: 4px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 12px; padding: 4px;
}
.tab {
  padding: 7px 18px; border: none; border-radius: 8px;
  background: transparent; color: var(--text2); cursor: pointer;
  font-size: 13px; font-family: inherit; white-space: nowrap; font-weight: 600;
}
.tab:hover { color: var(--text); }
.tab.active { background: var(--accent); color: #fff; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ===== Class cards ===== */
.class-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin-bottom: 22px; }
.class-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 18px 16px 14px; text-align: center; box-shadow: var(--shadow);
  position: relative; overflow: hidden;
}
.class-card.primary { border-color: var(--accent); }
.class-card.primary::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, var(--accent), #f08a4b);
}
.class-label { font-size: 11px; color: var(--text2); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px; font-weight: 700; }
.class-value { font-size: 46px; font-weight: 800; color: var(--accent); line-height: 1.05; font-variant-numeric: tabular-nums; }
.class-tier { font-size: 19px; margin: 4px 0; display: flex; gap: 8px; align-items: center; justify-content: center; font-weight: 700; }
.class-tier-img { height: 56px; vertical-align: middle; }
.class-bar-wrap {
  width: 200px; max-width: 100%; height: 7px; background: var(--surface3);
  border-radius: 4px; margin: 10px auto 6px; overflow: hidden;
}
.class-bar { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.5s; }
.class-sub { font-size: 11.5px; color: var(--text2); line-height: 1.6; }
.class-split { display: flex; justify-content: center; gap: 14px; margin: 6px 0 2px; font-size: 12px; color: var(--text2); }
.class-split b { color: var(--text); font-family: 'Consolas', monospace; font-size: 13px; }
.class-warn {
  display: inline-block; margin-top: 6px; font-size: 11px; color: var(--yellow);
  border: 1px solid var(--yellow); border-radius: 99px; padding: 1px 10px;
}

/* ===== Toggle switch ===== */
.switch-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text2); cursor: pointer; user-select: none; }
.switch-row input { display: none; }
.switch-ui {
  width: 34px; height: 19px; border-radius: 99px; background: var(--surface3);
  border: 1px solid var(--border); position: relative; transition: background 0.2s; flex-shrink: 0;
}
.switch-ui::after {
  content: ''; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px;
  border-radius: 50%; background: var(--text2); transition: left 0.2s, background 0.2s;
}
.switch-row input:checked + .switch-ui { background: var(--accent-soft); border-color: var(--accent); }
.switch-row input:checked + .switch-ui::after { left: 17px; background: var(--accent); }

/* ===== Sections / tables ===== */
.section { margin-bottom: 24px; }
.section-toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.section-toolbar h2 { margin: 0; }
.table-scroll { overflow-x: auto; border-radius: 12px; box-shadow: var(--shadow); -webkit-overflow-scrolling: touch; }
.hc-flex { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
.hc-flex > div { flex: 1 1 440px; min-width: 0; }
.hc-flex h3 { font-size: 13.5px; color: var(--accent); margin: 0 0 8px 2px; letter-spacing: 0.5px; }
.top50-flex { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
.top50-flex > div { flex: 1 1 440px; min-width: 0; }

table.data-table {
  width: 100%; border-collapse: collapse; font-size: 13px;
  background: var(--surface); border-radius: 12px; overflow: hidden;
}
table.data-table th {
  background: var(--surface3); padding: 8px 10px; text-align: left;
  font-weight: 600; color: var(--text2); cursor: pointer; user-select: none;
  white-space: nowrap; border-bottom: 1px solid var(--border); font-size: 12px;
}
table.data-table th:hover { color: var(--text); }
table.data-table th .sort-arrow { font-size: 10px; margin-left: 4px; }
table.data-table td {
  padding: 6px 10px; border-bottom: 1px solid var(--border);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px;
}
table.data-table tbody tr:last-child td { border-bottom: none; }
table.data-table tbody tr:hover td { background: var(--surface2); }
span.diff-chip {
  display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.4px;
  border-radius: 5px; padding: 1px 7px; color: #fff;
}
.diff-chip.diff-dekkapop { background: var(--dekkapop); }
.diff-chip.diff-easy { background: var(--easy); }
.diff-chip.diff-normal { background: var(--normal); }
.diff-chip.diff-hyper { background: var(--hyper); }
.diff-chip.diff-ex { background: var(--ex); }
.diff-dekkapop { color: var(--dekkapop); }
.diff-easy { color: var(--easy); }
.diff-normal { color: var(--normal); }
.diff-hyper { color: var(--hyper); }
.diff-ex { color: var(--ex); }
.medal-cell { font-size: 11px; }
.medal-img { width: 26px; height: 26px; vertical-align: middle; }
.score-cell { font-family: 'Consolas', monospace; font-variant-numeric: tabular-nums; }
.pts-cell { font-family: 'Consolas', monospace; color: var(--accent); font-weight: 600; }

details.legacy-details { margin-bottom: 24px; }
details.legacy-details > summary {
  cursor: pointer; font-size: 15px; font-weight: 700; color: var(--text);
  padding: 10px 14px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; user-select: none; box-shadow: var(--shadow);
}
details.legacy-details > summary:hover { border-color: var(--accent); }
details.legacy-details > summary .h2-sub { font-size: 12px; color: var(--text2); font-weight: normal; margin-left: 8px; }
details.legacy-details[open] > summary { margin-bottom: 14px; }

/* ===== Filters ===== */
.filters {
  display: flex; gap: 16px; align-items: flex-start; margin-bottom: 12px;
  flex-wrap: wrap; font-size: 13px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 14px; box-shadow: var(--shadow);
}
.filter-group { margin-bottom: 2px; }
.filter-group .filter-label { color: var(--text2); margin-bottom: 5px; font-weight: 700; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
.filter-group .filter-opts { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.filter-group .filter-opts label {
  display: flex; align-items: center; gap: 2px;
  background: var(--surface2); border-radius: 99px; padding: 2px 10px;
  cursor: pointer; font-size: 12px; color: var(--text2);
  border: 1px solid var(--border); user-select: none;
}
.filter-group .filter-opts label:hover { border-color: var(--text2); }
.filter-group .filter-opts label.checked { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
.filter-group .filter-opts input[type="checkbox"] { display: none; }
.filter-group .toggle-link {
  font-size: 11px; color: var(--blue); cursor: pointer; margin-left: 4px;
  text-decoration: underline; text-transform: none; letter-spacing: 0;
}
.filter-search {
  padding: 6px 12px; border: 1px solid var(--border); border-radius: 99px;
  background: var(--surface2); color: var(--text); font-size: 13px; font-family: inherit;
  width: 170px;
}
.filter-search:focus { outline: none; border-color: var(--accent); }
.filters-summary { display: none; }
.score-count { font-size: 12px; color: var(--text2); margin-bottom: 8px; }

/* ===== Lamp / rank matrices ===== */
.lamp-wrap { overflow-x: auto; max-width: 100%; border-radius: 12px; box-shadow: var(--shadow); -webkit-overflow-scrolling: touch; }
.lamp-table th, .lamp-table td { text-align: center; padding: 4px 3px; font-size: 12px; white-space: nowrap; }
/* border-collapse: collapse defeats position: sticky on cells in Chromium */
table.data-table.lamp-table { font-size: 12px; border-collapse: separate; border-spacing: 0; overflow: visible; }
.lamp-table th:first-child, .lamp-table td:first-child {
  position: sticky; left: 0; z-index: 1;
  background: var(--surface3);
}
.lamp-table tbody td:first-child { background: var(--surface2); }
.lamp-table tbody tr:hover td:first-child { background: var(--surface3); }

/* ===== Footer ===== */
.footer { margin-top: 40px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text2); text-align: center; }

#exportCanvas { display: none; }

/* ===== Mobile ===== */
@media (max-width: 640px) {
  .container { padding: 12px 12px 20px; }
  /* the app bar is tall once chips wrap — let it scroll away on phones */
  .appbar { position: static; }
  .appbar-inner { padding: 8px 12px; row-gap: 4px; }
  .appbar .stat-chip.optional { display: none; }
  .appbar-actions { margin-left: 0; }
  .class-value { font-size: 38px; }
  .filters { gap: 10px; padding: 10px; }
  .filters.collapsed .filter-group { display: none; }
  .filters.collapsed .filters-summary { display: block; }
  .filters-toggle { display: inline-block; }
  /* Score browser rows become cards */
  #scoreTable thead { display: none; }
  #scoreTable, #scoreTable tbody { display: block; }
  #scoreTable tbody tr {
    display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center;
    padding: 9px 12px; border-bottom: 1px solid var(--border);
  }
  #scoreTable tbody tr:hover td { background: transparent; }
  #scoreTable tbody td { display: inline-block; border: none; padding: 0; max-width: 100%; }
  #scoreTable td.c-title { flex-basis: 100%; font-weight: 600; white-space: normal; }
  #scoreTable td.c-artist { flex-basis: 100%; font-size: 11px; color: var(--text2); margin-top: -3px; }
  #scoreTable td[data-label]::before {
    content: attr(data-label); font-size: 9.5px; color: var(--text2);
    margin-right: 3px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  #scoreTable td.c-more { flex-basis: 100%; text-align: center; }
}
@media (min-width: 641px) {
  .filters-toggle { display: none; }
}
</style>
</head>
<body>
<!-- App bar -->
<div class="appbar">
  <div class="appbar-inner">
    <div class="brand">
      <div class="logo">P!</div>
      <span class="brand-name">Pop'n Score Tool</span>
      <span class="brand-ver" id="brandVersion"></span>
    </div>
    <div class="player-strip" id="playerStrip"></div>
    <div class="appbar-actions">
      <button class="icon-btn" id="btnTheme" title="Toggle theme">&#9789;</button>
      <button class="btn btn-ghost" id="btnDownloadHtml">Download HTML</button>
    </div>
  </div>
</div>

<div class="container">
  <!-- Tabs -->
  <div class="tabs-wrap">
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="popclass">Pop'n Class</button>
      <button class="tab" data-tab="scores">Score Browser</button>
      <button class="tab" data-tab="lamps">Clear Lamps</button>
      <button class="tab" data-tab="ranks">Ranks</button>
    </div>
  </div>

  <!-- Pop Class Panel -->
  <div class="tab-panel active" id="panel-popclass">
    <div class="class-grid" id="classGrid"></div>

    <!-- HC formula breakdown (hidden when DATA.hcClass is absent) -->
    <div class="section" id="hcSection" style="display:none">
      <div class="section-toolbar">
        <h2>High Cheers Formula<span class="h2-sub">Top 20 new + Top 40 old</span></h2>
        <button class="btn btn-green" id="btnExportImg">Export as Image</button>
        <label class="switch-row" title="Use the lifetime EASY-clear medal when the chart is uncleared this version">
          <input type="checkbox" id="hcEcToggle">
          <span class="switch-ui"></span>
          <span>EASY&#12463;&#12522;&#12450;&#12398;&#27508;&#20195;&#12513;&#12480;&#12523;&#12434;&#21442;&#29031;</span>
        </label>
      </div>
      <div class="hc-flex">
        <div>
          <h3>NEW SONGS &mdash; TOP 20</h3>
          <div class="table-scroll" id="hcNewTable"></div>
        </div>
        <div>
          <h3>OLD SONGS &mdash; TOP 40</h3>
          <div class="table-scroll" id="hcOldTable"></div>
        </div>
      </div>
    </div>

    <!-- Legacy Top 50 -->
    <details class="legacy-details" id="legacyDetails">
      <summary>Legacy Top 50 Charts<span class="h2-sub">old Top-50 average formula</span></summary>
      <div class="section-toolbar" id="legacyToolbar"></div>
      <div class="top50-flex" id="top50Flex"></div>
    </details>
  </div>

  <!-- Score Browser Panel -->
  <div class="tab-panel" id="panel-scores">
    <div class="filters" id="filtersContainer">
      <button class="btn btn-ghost filters-toggle" id="btnFiltersToggle">Filters</button>
      <span class="filters-summary" id="filtersSummary"></span>
    </div>
    <div class="score-count" id="scoreCount"></div>
    <div class="table-scroll">
      <table class="data-table" id="scoreTable">
        <thead>
          <tr>
            <th data-sort="title">Genre / Title</th>
            <th data-sort="artist">Artist</th>
            <th data-sort="diff">Diff</th>
            <th data-sort="level">Lv</th>
            <th data-sort="score">Score</th>
            <th data-sort="medal">Medal</th>
            <th data-sort="rank">Rank</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Clear Lamp Stats Panel -->
  <div class="tab-panel" id="panel-lamps">
    <h2>Clear Lamp per Level</h2>
    <div class="lamp-wrap">
      <table class="data-table lamp-table" id="lampTable">
        <thead><tr id="lampHeader"></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Rank Stats Panel -->
  <div class="tab-panel" id="panel-ranks">
    <h2>Rank per Level</h2>
    <div class="lamp-wrap">
      <table class="data-table lamp-table" id="rankTable">
        <thead><tr id="rankHeader"></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="footer">
    Pop'n Score Tool &mdash; generated <span id="exportDate"></span>
  </div>
</div>

<canvas id="exportCanvas"></canvas>

<script>
// === Embedded data (replaced by build script) ===
var DATA = {{DATA_PLACEHOLDER}};

// === Theme (auto via prefers-color-scheme, manual override on <html data-theme>) ===
(function() {
  var stored = null;
  try { stored = localStorage.getItem('popnme_theme'); } catch (e) {}
  if (stored === 'dark' || stored === 'light') {
    document.documentElement.setAttribute('data-theme', stored);
  }
  var btn = document.getElementById('btnTheme');
  function isDark() {
    var attr = document.documentElement.getAttribute('data-theme');
    if (attr) return attr === 'dark';
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function updateIcon() { btn.innerHTML = isDark() ? '&#9788;' : '&#9789;'; }
  btn.addEventListener('click', function() {
    var next = isDark() ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('popnme_theme', next); } catch (e) {}
    updateIcon();
  });
  if (window.matchMedia) {
    try {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateIcon);
    } catch (e) {}
  }
  updateIcon();
})();

// === Constants ===
var CLASS_TIERS = [
  { min: 91, name: '神', color: '#d0203a' },
  { min: 79, name: '仙人', color: '#c03050' },
  { min: 68, name: '将軍', color: '#c08020' },
  { min: 59, name: 'アイドル', color: '#b0a010' },
  { min: 46, name: '刑事', color: '#209040' },
  { min: 34, name: '番長', color: '#1a9080' },
  { min: 21, name: '小学生', color: '#2e70c0' },
  { min: 0, name: 'にゃんこ', color: '#907860' },
];

var MEDAL_ORDER = [
  'no_play',
  'failed_1', 'failed_2', 'failed_3',
  'assist_clear',
  'easy_clear',
  'normal_clear', 'normal_clear_in_20_bad', 'normal_clear_in_5_bad',
  'full_combo', 'full_combo_in_20_good', 'full_combo_in_5_good',
  'perfect'
];

var MEDAL_LABELS = {
  'no_play': 'No Play', 'assist_clear': 'ASSIST', 'easy_clear': '緑⬤',
  'failed_1': '灰⬤', 'failed_2': '灰◆', 'failed_3': '灰★',
  'normal_clear': '銅⬤', 'normal_clear_in_20_bad': '銅◆', 'normal_clear_in_5_bad': '銅★',
  'full_combo': '銀⬤', 'full_combo_in_20_good': '銀◆', 'full_combo_in_5_good': '銀★',
  'perfect': '金★'
};

var MEDAL_COLORS = {
  'no_play': '#bbb', 'assist_clear': '#7fb8d8', 'easy_clear': '#2ea868',
  'failed_1': '#999', 'failed_2': '#999', 'failed_3': '#999',
  'normal_clear': '#b87333', 'normal_clear_in_20_bad': '#b87333', 'normal_clear_in_5_bad': '#b87333',
  'full_combo': '#888', 'full_combo_in_20_good': '#888', 'full_combo_in_5_good': '#888',
  'perfect': '#d4a017'
};

// srandom medal sprite numbering — 1 is best, descending, with easy_clear
// bumped to the tail per srandom's table convention. no_play and assist_clear
// have no image and fall back to text.
var MEDAL_IMG_NUM = {
  perfect: 1,
  full_combo_in_5_good: 2,
  full_combo_in_20_good: 3,
  full_combo: 4,
  normal_clear_in_5_bad: 5,
  normal_clear_in_20_bad: 6,
  normal_clear: 7,
  failed_3: 8,
  failed_2: 9,
  failed_1: 10,
  easy_clear: 11,
};
function medalImgUrl(medal) {
  var n = MEDAL_IMG_NUM[medal];
  if (!n) return null;
  // Prefer the base64 fetched at scrape time so the viewer works offline;
  // fall back to the live srandom URL if the embed step couldn't fetch (e.g. CORS).
  if (DATA.medalImages && DATA.medalImages[n]) return DATA.medalImages[n];
  return 'https://static.srandom.com/img/medal/' + n + '.png';
}
function medalCellHtml(medal) {
  var url = medalImgUrl(medal);
  if (url) return '<img class="medal-img" src="' + url + '" alt="' + esc(MEDAL_LABELS[medal] || medal) + '" title="' + esc(MEDAL_LABELS[medal] || medal) + '">';
  return '<span style="color:' + (MEDAL_COLORS[medal] || '#555') + '">' + (MEDAL_LABELS[medal] || medal || '-') + '</span>';
}
function diffChipHtml(d) {
  return '<span class="diff-chip diff-' + d + '">' + (DIFF_LABELS[d] || d.toUpperCase()) + '</span>';
}

var DIFF_COLORS = { dekkapop: '#a06ec0', easy: '#1ea868', normal: '#2e7ed6', hyper: '#d08a10', ex: '#d04030' };

var DIFF_LABELS = { dekkapop: 'でっか', easy: 'EASY', normal: 'NORMAL', hyper: 'HYPER', ex: 'EX' };

var ALL_DIFFS = ['easy', 'normal', 'hyper', 'ex', 'dekkapop'];

var RANK_ORDER = ['E', 'D', 'C', 'B', 'B+', 'A', 'A+', 'AA', 'AA+', 'AAA', 'S'];

// === Legacy Pop Class calculation (Top-50 average) ===
function medalBonus(medal) {
  if (!medal) return 0;
  if (medal === 'easy_clear' || medal.indexOf('normal_clear') === 0) return 3000;
  if (medal.indexOf('full_combo') === 0 || medal === 'perfect') return 5000;
  return 0;
}

function calcClassPoints(lv, score, medal) {
  if (!score || score < 50000) return 0;
  var raw = (10000 * lv + score - 50000 + medalBonus(medal)) / 5440;
  return Math.min(Math.floor(raw * 100) / 100, 100);
}

function getTier(value) {
  for (var i = 0; i < CLASS_TIERS.length; i++) {
    if (value >= CLASS_TIERS[i].min) return CLASS_TIERS[i];
  }
  return CLASS_TIERS[CLASS_TIERS.length - 1];
}

function getNextTier(value) {
  for (var i = CLASS_TIERS.length - 1; i >= 0; i--) {
    if (CLASS_TIERS[i].min > value) return CLASS_TIERS[i];
  }
  return null;
}

// === HC formula display helpers (points precomputed at scrape time) ===
function floorTo(x, p) {
  var m = Math.pow(10, p);
  return Math.floor(x * m) / m;
}
function roundTo(x, p) {
  var m = Math.pow(10, p);
  return Math.round(x * m) / m;
}
function hcSumToDisplay(entries) {
  var sum = 0;
  for (var i = 0; i < entries.length; i++) sum += entries[i].point;
  return floorTo(roundTo(sum, 8) / 60, 2);
}
// Top-40 selection for a given EASY-clear toggle state. oldResolved entries carry
// both variants precomputed (point/medal and pointEC/medalEC).
function hcTop40Old(oldResolved, useEC) {
  var list = oldResolved.map(function(e) {
    return {
      title: e.title, genre: e.genre, diff: e.diff, level: e.level,
      score: e.versionScore, medal: useEC ? e.medalEC : e.medal,
      point: useEC ? e.pointEC : e.point,
    };
  });
  list.sort(function(a, b) { return b.point - a.point; });
  return list.slice(0, 40);
}

var hcUseEC = false;
try { hcUseEC = localStorage.getItem('popnme_hc_ec') === 'true'; } catch (e) {}

// === Flatten scores into per-chart rows ===
var allCharts = [];
(function() {
  var scores = DATA.scores || [];
  for (var si = 0; si < scores.length; si++) {
    var song = scores[si];
    var charts = song.charts || {};
    for (var di = 0; di < ALL_DIFFS.length; di++) {
      var d = ALL_DIFFS[di];
      if (!charts[d]) continue;
      var c = charts[d];
      allCharts.push({
        title: song.title,
        genre: song.genre,
        artist: song.artist,
        diff: d,
        level: c.level || 0,
        score: c.score || 0,
        medal: c.medal || 'no_play',
        rank: c.rank || null,
        classPoints: calcClassPoints(c.level || 0, c.score || 0, c.medal),
      });
    }
  }
})();

// === Calculate legacy Pop Class ===
var top50Charts = [];
var popClassValue = 0;
(function() {
  var sorted = allCharts.slice().sort(function(a, b) { return b.classPoints - a.classPoints; });
  top50Charts = sorted.slice(0, 50);
  var sum = 0;
  for (var i = 0; i < top50Charts.length; i++) sum += top50Charts[i].classPoints;

function renderClassCards() {
  var grid = document.getElementById('classGrid');
  var cards = [];

  // Official (primary when present)
  var oc = DATA.officialClass;
  if (oc && typeof oc.value === 'number') {
    var tierImgSrc = oc.tierImgData

      + '<div class="class-label">Official' + (DATA.version ? ' &middot; ' + esc(DATA.version) : '') + '</div>'
      + '<div class="class-value">' + oc.value.toFixed(2) + '</div>'
      + '<div class="class-tier">' + imgTag + '</div>'
      + '<div class="class-sub">Scraped from the official status page</div>'
      + '</div>');
  }

  // HC formula (calculated)
  var hc = DATA.hcClass;
  if (hc) {
    var hcVal = hcUseEC ? hc.valueEC : hc.value;
    var hcOld = hcUseEC ? hc.oldSumEC : hc.oldSum;
    var caveat = '';
    if (hc.complete !== true) {
      caveat = '<div><span class="class-warn">partial data &mdash; scrape stopped early</span></div>';
    }
    cards.push('<div class="class-card">'
      + '<div class="class-label">Calculated &middot; HC formula</div>'
      + '<div class="class-value">' + hcVal.toFixed(2) + '</div>'
      + '<div class="class-split"><span>new <b>' + hc.newSum.toFixed(2) + '</b></span><span>old <b>' + hcOld.toFixed(2) + '</b></span></div>'
      + '<div class="class-sub">Top 20 new + Top 40 old &middot; ' + hc.resolvedCount + ' old charts resolved'
      + (hcUseEC ? ' &middot; EASY-clear medals from lifetime' : '') + '</div>'
      + caveat
      + '</div>');
  }

  // Legacy calc
  var calcTier = getTier(popClassValue);
  var calcNext = getNextTier(popClassValue);
  var calcProgress = 100;
  var calcProgressLabel = 'MAX';
  if (calcNext) {
    calcProgress = ((popClassValue - calcTier.min) / (calcNext.min - calcTier.min)) * 100;
    calcProgressLabel = 'Next: ' + calcNext.name + ' (' + calcNext.min.toFixed(2) + ')';
  }
  var scoredCount = allCharts.filter(function(c) { return c.classPoints > 0; }).length;
  cards.push('<div class="class-card">'
    + '<div class="class-label">Calculated &middot; legacy Top-50</div>'
    + '<div class="class-value" style="color:' + calcTier.color + '">' + popClassValue.toFixed(2) + '</div>'
    + '<div class="class-tier" style="color:' + calcTier.color + '">' + calcTier.name + '</div>'
    + '<div class="class-bar-wrap"><div class="class-bar" style="width:' + Math.min(calcProgress, 100) + '%;background:' + calcTier.color + '"></div></div>'
    + '<div class="class-sub">' + calcProgressLabel + ' &middot; Top 50 avg of ' + scoredCount + ' scored charts</div>'
    + '</div>');

  grid.innerHTML = cards.join('');
}

function renderScoreTable() {
  var checkedDiffs = {};
  document.querySelectorAll('#filterDiffOpts input:checked').forEach(function(cb) {
    checkedDiffs[cb.getAttribute('data-diff')] = true;
  });
  var checkedLvs = {};
  document.querySelectorAll('#filterLvOpts input:checked').forEach(function(cb) {
    checkedLvs[parseInt(cb.getAttribute('data-lv'))] = true;
  });
  var checkedMedals = {};
  document.querySelectorAll('#filterMedalOpts input:checked').forEach(function(cb) {
    checkedMedals[cb.getAttribute('data-medal')] = true;
  });
  var search = document.getElementById('filterSearch').value.toLowerCase();

  var filtered = allCharts.filter(function(c) {
    if (!checkedDiffs[c.diff]) return false;
    // Level filter applies only to charts with a level; level-less (dekkapop) bypass.
    if (c.level > 0 && !checkedLvs[c.level]) return false;
    if (!checkedMedals[c.medal]) return false;
    if (search && c.title.toLowerCase().indexOf(search) < 0 && (!c.genre || c.genre.toLowerCase().indexOf(search) < 0)) return false;
    return true;
  });

  filtered.sort(function(a, b) {
    var va = a[scoreSort.key], vb = b[scoreSort.key];
    if (scoreSort.key === 'medal') {
      va = MEDAL_ORDER.indexOf(a.medal);
      vb = MEDAL_ORDER.indexOf(b.medal);
    }
    if (scoreSort.key === 'rank') {
      va = a.rank ? RANK_ORDER.indexOf(a.rank) : -1;
      vb = b.rank ? RANK_ORDER.indexOf(b.rank) : -1;
    }
    if (va === vb) return 0;
    if (va === null || va === undefined) return 1;
    if (vb === null || vb === undefined) return -1;
    if (typeof va === 'string') return va.localeCompare(vb) * scoreSort.dir;
    return (va - vb) * scoreSort.dir;
  });

  document.getElementById('scoreCount').textContent = filtered.length + ' charts';
  var summary = document.getElementById('filtersSummary');
  if (summary) summary.textContent = filtered.length + ' charts shown';

  var tbody = document.querySelector('#scoreTable tbody');
  var html = '';
  var limit = Math.min(filtered.length, 500);
  for (var i = 0; i < limit; i++) {
    var c = filtered[i];
    html += '<tr>'
      + '<td class="c-title">' + esc(displayTitle(c.title, c.genre)) + '</td>'
      + '<td class="c-artist">' + esc(c.artist) + '</td>'
      + '<td>' + diffChipHtml(c.diff) + '</td>'
      + '<td data-label="Lv">' + (c.level > 0 ? c.level : '-') + '</td>'
      + '<td class="score-cell" data-label="Score">' + (c.score > 0 ? c.score : '-') + '</td>'
      + '<td class="medal-cell">' + medalCellHtml(c.medal) + '</td>'
      + '<td data-label="Rank">' + (c.rank || '-') + '</td>'
      + '</tr>';
  }
  if (filtered.length > 500) {
    html += '<tr><td colspan="7" class="c-more" style="text-align:center;color:var(--text2)">... and ' + (filtered.length - 500) + ' more</td></tr>';
  }
  tbody.innerHTML = html;
}

      for (var mi2 = 0; mi2 < MEDAL_ORDER.length; mi2++) lvStats[lv][MEDAL_ORDER[mi2]] = 0;
    }
    lvStats[lv].total++;
    if (lvStats[lv][c.medal] !== undefined) lvStats[lv][c.medal]++;
  }

  var tbody = document.querySelector('#lampTable tbody');
  var html = '';
  var levels = Object.keys(lvStats).map(Number).sort(function(a,b){return a-b;});
  var totals = { total: 0 };
  for (var mi4 = 0; mi4 < MEDAL_ORDER.length; mi4++) totals[MEDAL_ORDER[mi4]] = 0;

  for (var li = 0; li < levels.length; li++) {
    var lv = levels[li];
    var s = lvStats[lv];
    totals.total += s.total;
    html += '<tr><td><b>' + lv + '</b></td><td>' + s.total + '</td>';
    for (var mi3 = 0; mi3 < MEDAL_ORDER.length; mi3++) {
      var m = MEDAL_ORDER[mi3];
      var count = s[m] || 0;
      totals[m] += count;
      var color = MEDAL_COLORS[m] || '#555';
      html += '<td style="color:' + color + '">' + (count || '-') + '</td>';
    }
    html += '</tr>';
  }

  // Total row
  html += '<tr style="border-top:2px solid var(--border);font-weight:bold"><td>Total</td><td>' + totals.total + '</td>';
  for (var mi5 = 0; mi5 < MEDAL_ORDER.length; mi5++) {
    var m2 = MEDAL_ORDER[mi5];
    var color2 = MEDAL_COLORS[m2] || '#555';
    html += '<td style="color:' + color2 + '">' + (totals[m2] || '-') + '</td>';
  }
  html += '</tr>';

  tbody.innerHTML = html;
})();

// === Rank Lamp Stats ===
(function() {
  var RANK_DISPLAY = [null, 'E', 'D', 'C', 'B', 'B+', 'A', 'A+', 'AA', 'AA+', 'AAA', 'S'];
  var RANK_LABELS = ['No Play', 'E', 'D', 'C', 'B', 'B+', 'A', 'A+', 'AA', 'AA+', 'AAA', 'S'];

  }

  // Compute stats — skip level-less charts (e.g. dekkapop) so they don't bucket under Lv 0.
  var lvStats = {};
  for (var i = 0; i < allCharts.length; i++) {
    var c = allCharts[i];

    if (!lvStats[lv]) {
      lvStats[lv] = { total: 0 };

    }
    lvStats[lv].total++;
    lvStats[lv][String(c.rank)]++;
  }

  var tbody = document.querySelector('#rankTable tbody');
  var html = '';
  var levels = Object.keys(lvStats).map(Number).sort(function(a,b){return a-b;});
  var totals = { total: 0 };
  for (var ri3 = 0; ri3 < RANK_DISPLAY.length; ri3++) totals[String(RANK_DISPLAY[ri3])] = 0;

  for (var li = 0; li < levels.length; li++) {
    var lv = levels[li];
    var s = lvStats[lv];
    totals.total += s.total;
    html += '<tr><td><b>' + lv + '</b></td><td>' + s.total + '</td>';
    for (var ri4 = 0; ri4 < RANK_DISPLAY.length; ri4++) {
      var count = s[String(RANK_DISPLAY[ri4])] || 0;
      totals[String(RANK_DISPLAY[ri4])] += count;
      html += '<td>' + (count || '-') + '</td>';
    }
    html += '</tr>';
  }

  // Total row
  html += '<tr style="border-top:2px solid var(--border);font-weight:bold"><td>Total</td><td>' + totals.total + '</td>';
  for (var ri5 = 0; ri5 < RANK_DISPLAY.length; ri5++) {
    html += '<td>' + (totals[String(RANK_DISPLAY[ri5])] || '-') + '</td>';
  }
  html += '</tr>';

  tbody.innerHTML = html;
})();

// Pre-load embedded medal sprites into HTMLImageElements so canvas can draw them.
function loadMedalSprites() {
  var loaded = {};
  var keys = Object.keys(MEDAL_IMG_NUM);
  var jobs = keys.map(function(medal) {
    var src = medalImgUrl(medal);
    if (!src) return Promise.resolve();
    return new Promise(function(resolve) {
      var img = new Image();
      // Remote fallback sprites must be CORS-clean or they taint the export
      // canvas; if the host refuses, onerror fires and text fallback is used.
      if (src.indexOf('http') === 0) img.crossOrigin = 'anonymous';
      img.onload = function() { loaded[medal] = img; resolve(); };
      img.onerror = function() { resolve(); };
      img.src = src;
    });
  });
  return Promise.all(jobs).then(function() { return loaded; });
}

// === Image Export ===
(function() {
  var btn = document.getElementById('btnExportImg');
  if (btn) btn.addEventListener('click', function() {
    loadMedalSprites().then(DATA.hcClass ? renderHcImage : renderTop50Image);
  });
  var btnLegacy = document.getElementById('btnExportImgLegacy');
  if (btnLegacy) btnLegacy.addEventListener('click', function() {
    loadMedalSprites().then(renderTop50Image);
  });
})();

// Shared canvas text-row helpers (PNG is always drawn on the light palette)
var IMG_COLORS = {
  bg: '#fef6f0', head: '#ffe0d0', stripe: '#fff0ea',
  text: '#3d2b1f', text2: '#907860', accent: '#e94560'
};

function drawImageRows(ctx, entries, rankStart, offsetX, startY, tableW, cols, rowH, medalImgs) {
  var y = startY;
  ctx.font = '12px Segoe UI, sans-serif';
  for (var ri = 0; ri < entries.length; ri++) {
    var c = entries[ri];
    if (ri % 2 === 0) {
      ctx.fillStyle = IMG_COLORS.stripe;
      ctx.fillRect(offsetX, y, tableW, rowH);
    }
    var x = offsetX + 8;
    ctx.fillStyle = IMG_COLORS.text2;
    ctx.fillText((rankStart + ri).toString(), x, y + 19);
    x += cols[0];

    ctx.fillStyle = IMG_COLORS.text;
    var titleText = displayTitle(c.title, c.genre);
    if (titleText.length > 28) titleText = titleText.substring(0, 26) + '...';
    ctx.fillText(titleText, x, y + 19);
    x += cols[1];

    ctx.fillStyle = DIFF_COLORS[c.diff] || IMG_COLORS.text;
    ctx.fillText(DIFF_LABELS[c.diff] || c.diff.toUpperCase(), x, y + 19);
    x += cols[2];

    ctx.fillStyle = IMG_COLORS.text;
    ctx.fillText(String(c.level), x, y + 19);
    x += cols[3];

    ctx.fillText(c.score > 0 ? String(c.score) : '-', x, y + 19);
    x += cols[4];

    var medalImg = medalImgs[c.medal];
    if (medalImg) {
      var medalSize = 22;
      ctx.drawImage(medalImg, x, y + (rowH - medalSize) / 2, medalSize, medalSize);
    } else {
      ctx.fillStyle = MEDAL_COLORS[c.medal] || IMG_COLORS.text2;
      ctx.fillText(MEDAL_LABELS[c.medal] || c.medal || '-', x, y + 19);
    }
    x += cols[5];

    ctx.fillStyle = IMG_COLORS.accent;
    ctx.fillText(c.ptsText, x, y + 19);

    y += rowH;
  }
}

function drawImageHeader(ctx, headers, offsetX, y, tableW, cols, headerH) {
  ctx.fillStyle = IMG_COLORS.head;
  ctx.fillRect(offsetX, y, tableW, headerH);
  ctx.fillStyle = IMG_COLORS.text2;
  ctx.font = 'bold 12px Segoe UI, sans-serif';
  var x = offsetX + 8;
  for (var hi = 0; hi < headers.length; hi++) {
    ctx.fillText(headers[hi], x, y + 26);
    x += cols[hi];
  }
}

function finishImageDownload(canvas, ctx, titleRight, filename) {
  var chara = DATA.player && DATA.player['使用キャラクター'];
  var hasAvatar = chara && chara.imgData;
  function doDownload() {
    var link = document.createElement('a');
    link.download = filename;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }
  if (hasAvatar) {
    var avatarImg = new Image();
    avatarImg.onload = function() {
      ctx.drawImage(avatarImg, titleRight, 12, 36, 36);
      doDownload();
    };
    avatarImg.onerror = doDownload;
    avatarImg.src = chara.imgData;
  } else {
    doDownload();
  }
}

// Legacy Top-50 image (two 25-row columns)
function renderTop50Image(medalImgs) {
  var canvas = document.getElementById('exportCanvas');
  var ctx = canvas.getContext('2d');

  var rowH = 28, headerH = 40, titleH = 60, footerH = 30, colGap = 16;
  var cols = [34, 250, 54, 34, 60, 50, 60];
  var tableW = 16;
  for (var ci = 0; ci < cols.length; ci++) tableW += cols[ci];

  var entries = top50Charts.map(function(c) {
    return { title: c.title, genre: c.genre, diff: c.diff, level: c.level, score: c.score, medal: c.medal, ptsText: c.classPoints.toFixed(2) };
  });

  var rowCount = Math.min(entries.length, 25);
  var hasTwoCols = entries.length > 25;
  var totalW = hasTwoCols ? (tableW * 2 + colGap) : tableW;
  var totalH = titleH + headerH + (rowCount * rowH) + footerH;

  canvas.width = totalW;
  canvas.height = totalH;
  ctx.fillStyle = IMG_COLORS.bg;
  ctx.fillRect(0, 0, totalW, totalH);

  var tier = getTier(popClassValue);
  ctx.fillStyle = tier.color;
  ctx.font = 'bold 24px Segoe UI, sans-serif';
  ctx.fillText("Pop'n Score Tool", 10, 30);
  var titleRight = 10 + ctx.measureText("Pop'n Score Tool").width + 16;
  var chara = DATA.player && DATA.player['使用キャラクター'];
  var textLeft = (chara && chara.imgData) ? titleRight + 44 : titleRight;
  ctx.fillStyle = IMG_COLORS.text;
  ctx.font = '16px Segoe UI, sans-serif';
  var playerName = (DATA.player && DATA.player['プレーヤー名']) || '';
  var classLine = playerName + '  Calc: ' + popClassValue.toFixed(2) + ' (' + tier.name + ')';
  if (DATA.officialClass && typeof DATA.officialClass.value === 'number') {
    classLine += '  Official: ' + DATA.officialClass.value.toFixed(2);
  }
  ctx.fillText(classLine, textLeft, 30);
  ctx.fillStyle = IMG_COLORS.text2;
  ctx.font = '11px Segoe UI, sans-serif';
  ctx.fillText('Top 50 Charts', textLeft, 48);

  var headers = ['#', 'Genre / Title', 'Diff', 'Lv', 'Score', 'Medal', 'Pts'];
  drawImageHeader(ctx, headers, 0, titleH, tableW, cols, headerH);
  drawImageRows(ctx, entries.slice(0, 25), 1, 0, titleH + headerH, tableW, cols, rowH, medalImgs);
  if (hasTwoCols) {
    drawImageHeader(ctx, headers, tableW + colGap, titleH, tableW, cols, headerH);
    drawImageRows(ctx, entries.slice(25), 26, tableW + colGap, titleH + headerH, tableW, cols, rowH, medalImgs);
  }

  ctx.fillStyle = IMG_COLORS.text2;
  ctx.font = '10px Segoe UI, sans-serif';
  ctx.fillText("Generated by Pop'n Score Tool | " + (DATA.exportedAt || ''), 10, totalH - 10);

  finishImageDownload(canvas, ctx, titleRight, 'popn_class_top50.png');
}

// HC formula image: [ New Top 20 | Old Top 40 #1-20 | Old Top 40 #21-40 ]
function renderHcImage(medalImgs) {
  var hc = DATA.hcClass;
  var canvas = document.getElementById('exportCanvas');
  var ctx = canvas.getContext('2d');

  var rowH = 28, headerH = 40, titleH = 64, labelH = 24, footerH = 30, colGap = 16;
  var cols = [34, 250, 54, 34, 60, 50, 60];
  var tableW = 16;
  for (var ci = 0; ci < cols.length; ci++) tableW += cols[ci];

  function toEntry(c) {
    return { title: c.title, genre: c.genre, diff: c.diff, level: c.level, score: c.score, medal: c.medal, ptsText: floorTo(c.point / 60, 3).toFixed(3) };
  }
  var top40 = hcTop40Old(hc.oldResolved || [], hcUseEC).map(toEntry);
  var lists = [
    { label: 'NEW SONGS  TOP 20', entries: (hc.top20New || []).map(toEntry), rankStart: 1 },
    { label: 'OLD SONGS  TOP 40 (1-20)', entries: top40.slice(0, 20), rankStart: 1 },
    { label: 'OLD SONGS  TOP 40 (21-40)', entries: top40.slice(20, 40), rankStart: 21 },
  ];

  var totalW = tableW * 3 + colGap * 2;
  var totalH = titleH + labelH + headerH + (20 * rowH) + footerH;

  canvas.width = totalW;
  canvas.height = totalH;
  ctx.fillStyle = IMG_COLORS.bg;
  ctx.fillRect(0, 0, totalW, totalH);

  ctx.fillStyle = IMG_COLORS.accent;
  ctx.font = 'bold 24px Segoe UI, sans-serif';
  ctx.fillText("Pop'n Score Tool", 10, 30);
  var titleRight = 10 + ctx.measureText("Pop'n Score Tool").width + 16;
  var chara = DATA.player && DATA.player['使用キャラクター'];
  var textLeft = (chara && chara.imgData) ? titleRight + 44 : titleRight;

  var hcVal = hcUseEC ? hc.valueEC : hc.value;
  var hcOld = hcUseEC ? hc.oldSumEC : hc.oldSum;
  ctx.fillStyle = IMG_COLORS.text;
  ctx.font = '16px Segoe UI, sans-serif';
  var playerName = (DATA.player && DATA.player['プレーヤー名']) || '';
  var classLine = playerName + "  Pop'n Class (calc): " + hcVal.toFixed(2)
    + ' = new ' + hc.newSum.toFixed(2) + ' + old ' + hcOld.toFixed(2);
  if (DATA.officialClass && typeof DATA.officialClass.value === 'number') {
    classLine += '   Official: ' + DATA.officialClass.value.toFixed(2);
  }
  ctx.fillText(classLine, textLeft, 30);
  ctx.fillStyle = IMG_COLORS.text2;
  ctx.font = '11px Segoe UI, sans-serif';
  var subLine = 'High Cheers formula (Top 20 new + Top 40 old)';
  subLine += '  |  Legacy Top-50 calc: ' + popClassValue.toFixed(2);
  if (hcUseEC) subLine += '  |  w/ lifetime EASY-clear medals';
  if (hc.complete !== true) subLine += '  |  PARTIAL DATA';
  ctx.fillText(subLine, textLeft, 50);

  var headers = ['#', 'Genre / Title', 'Diff', 'Lv', 'Score', 'Medal', 'Pts'];
  for (var li = 0; li < lists.length; li++) {
    var offsetX = li * (tableW + colGap);
    ctx.fillStyle = IMG_COLORS.accent;
    ctx.font = 'bold 13px Segoe UI, sans-serif';
    ctx.fillText(lists[li].label, offsetX + 8, titleH + 14);
    drawImageHeader(ctx, headers, offsetX, titleH + labelH, tableW, cols, headerH);
    drawImageRows(ctx, lists[li].entries, lists[li].rankStart, offsetX, titleH + labelH + headerH, tableW, cols, rowH, medalImgs);
  }

  ctx.fillStyle = IMG_COLORS.text2;
  ctx.font = '10px Segoe UI, sans-serif';
  ctx.fillText("Generated by Pop'n Score Tool | " + (DATA.exportedAt || ''), 10, totalH - 10);

  finishImageDownload(canvas, ctx, titleRight, 'popn_class_hc.png');
}

// === Download HTML ===
document.getElementById('btnDownloadHtml').addEventListener('click', function() {
  var html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  var blob = new Blob([html], { type: 'text/html' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'popn_viewer_' + new Date().toISOString().slice(0, 10) + '.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

// === Utility ===
function esc(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function displayTitle(title, genre) {
  if (!genre || genre === title) return title;
  var baseTitle = title.replace(/ \[UPPER\]$/, '');
  if (genre === baseTitle) return title;
  return genre + ' / ' + title;
}
